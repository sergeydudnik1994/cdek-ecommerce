name: Update Open Graph Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-html-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tag updater
        run: |
          python3 - << 'EOF'
          import os
          import re

          BASE_DIR = "."
          BASE_URL = "https://cdek-ecommerce.ru"
          DEFAULT_OG_IMAGE = f"{BASE_URL}/og-image.png"

          for root, dirs, files in os.walk(BASE_DIR):
              # Пропускаем системные папки и компоненты
              if any(skip in root for skip in [".git", ".github", "components", "scripts"]):
                  continue
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      # Извлекаем title
                      title_m = re.search(r"<title>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
                      title = title_m.group(1).strip() if title_m else "СДЭК E-Commerce"

                      # Извлекаем description
                      desc_m = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', content, re.IGNORECASE)
                      desc = desc_m.group(1).strip() if desc_m else title

                      # Формируем каноничный URL страницы
                      rel_path = os.path.relpath(filepath, BASE_DIR).replace("\\", "/")
                      if rel_path == "index.html":
                          page_url = f"{BASE_URL}/"
                      else:
                          clean_path = rel_path.replace("index.html", "").strip("/")
                          page_url = f"{BASE_URL}/{clean_path}/" if clean_path else f"{BASE_URL}/"

                      og_block = f"""<!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="СДЭК E-Commerce" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="{title}" />
    <meta property="og:description" content="{desc}" />
    <meta property="og:url" content="{page_url}" />
    <meta property="og:image" content="{DEFAULT_OG_IMAGE}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{title}" />
    <meta name="twitter:description" content="{desc}" />
    <meta name="twitter:image" content="{DEFAULT_OG_IMAGE}" />"""

                      # Очищаем старые теги Open Graph и Twitter
                      content = re.sub(r'<!--\s*(?:Open Graph|Twitter).*?-->', '', content, flags=re.DOTALL)
                      content = re.sub(r'\n\s*<meta\s+property=["\']og:[^>]*>', '', content)
                      content = re.sub(r'\n\s*<meta\s+name=["\']twitter:[^>]*>', '', content)

                      # Вставляем новый блок перед закрывающим тегом </head>
                      if "</head>" in content:
                          content = content.replace("</head>", f"  {og_block}\n</head>")
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(content)
                          print(f"Обновлен: {filepath}")

          print("Все страницы успешно обработаны.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html **/*.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update Open Graph and Twitter cards [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Изменений нет, все теги актуальны."
          fi

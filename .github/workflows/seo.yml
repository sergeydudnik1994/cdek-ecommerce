name: Build SEO Matrix & Push IndexNow

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/pages_data.json'
      - 'scripts/build_seo.py'
      - '.github/workflows/seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run SEO Generator & Push IndexNow
        run: |
          python scripts/build_seo.py

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml integrations/ services/
          git commit -m "Auto-generate SEO pages, breadcrumbs and sitemap [skip ci]" || echo "No changes to commit"
          git push origin main

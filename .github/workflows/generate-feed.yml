name: Generate YML Feed for Yandex

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Yandex Compliant Feed
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from xml.dom import minidom
          from datetime import datetime, timezone, timedelta

          BASE_URL = "https://cdek-ecommerce.ru"
          COMPANY_NAME = "СДЭК E-Commerce"

          # Укажите точные цифры, которые физически отображаются на страницах сайта
          RATING_VALUE = "5.0"
          REVIEWS_COUNT = "25"
          YEARS_EXP = "6"

          moscow_tz = timezone(timedelta(hours=3))
          now = datetime.now(moscow_tz).strftime("%Y-%m-%dT%H:%M:%S+03:00")

          yml_catalog = ET.Element("yml_catalog", date=now)
          shop = ET.SubElement(yml_catalog, "shop")

          ET.SubElement(shop, "name").text = COMPANY_NAME
          ET.SubElement(shop, "company").text = COMPANY_NAME
          ET.SubElement(shop, "url").text = BASE_URL

          currencies = ET.SubElement(shop, "currencies")
          ET.SubElement(currencies, "currency", id="RUB", rate="1")

          categories = ET.SubElement(shop, "categories")
          ET.SubElement(categories, "category", id="1").text = "Курьерские и логистические услуги"
          ET.SubElement(categories, "category", id="2", parentId="1").text = "Доставка для интернет-магазинов"
          ET.SubElement(categories, "category", id="3", parentId="1").text = "Доставка для маркетплейсов"
          ET.SubElement(categories, "category", id="4", parentId="1").text = "Грузоперевозки и спецдоставка"
          ET.SubElement(categories, "category", id="5", parentId="1").text = "Корпоративное обслуживание B2B"

          offers_data = [
              {
                  "id": "srv_ecom",
                  "cat": "2",
                  "path": "/dogovor/internet-magazin/",
                  "price": "205",
                  "desc": "Курьерская доставка для интернет-магазинов. Доставка заказов интернет-магазинов по тарифу Посылка (от 205 руб. по городу до 1 кг). Прием наложенного платежа с формированием чеков по 54-ФЗ, забор курьером и выдача через сеть ПВЗ."
              },
              {
                  "id": "srv_market",
                  "cat": "3",
                  "path": "/dogovor/marketplace/",
                  "price": "205",
                  "desc": "Доставка заказов с маркетплейсов по схемам FBS и DBS. Логистическое обслуживание селлеров Wildberries, Ozon и Яндекс Маркет. Отгрузка отправлений по схемам FBS, rFBS и DBS с автоматической синхронизацией трек-номеров по API."
              },
              {
                  "id": "srv_clothes",
                  "cat": "4",
                  "path": "/services/dostavka-odezhdy/",
                  "price": "250",
                  "desc": "Доставка одежды и обуви с примеркой и частичным выкупом. Курьерская доставка и обслуживание в пунктах выдачи заказов с возможностью примерки до 15 минут, частичного выкупа позиций и возврата неподошедших товаров."
              },
              {
                  "id": "srv_fulf",
                  "cat": "4",
                  "path": "/services/fulfillment/",
                  "price": "1500",
                  "desc": "Складское хранение, комплектация и фулфилмент для e-commerce. Комплекс складских операций: приемка партий, ответственное хранение, маркировка товаров Честный Знак, сборка заказов, упаковка и передача в доставку."
              },
              {
                  "id": "srv_heavy",
                  "cat": "4",
                  "path": "/dogovor/krupnogabarit/",
                  "price": "450",
                  "desc": "Доставка крупногабаритных грузов и оборудования. Транспортировка тяжелых и объемных отправлений по России. Забор с адреса отправителя грузовым транспортом, отслеживание по трек-номеру и доставка до двери получателя."
              },
              {
                  "id": "srv_parts",
                  "cat": "4",
                  "path": "/dogovor/avtozapchasti/",
                  "price": "250",
                  "desc": "Доставка автозапчастей и комплектующих для интернет-магазинов. Транспортная логистика для магазинов автотоваров и станций техобслуживания: перевозка деталей, кузовных элементов и расходных материалов с кассовым обслуживанием."
              },
              {
                  "id": "srv_ip",
                  "cat": "5",
                  "path": "/dogovor/ip/",
                  "price": "205",
                  "desc": "Оформление B2B-договора СДЭК для индивидуальных предпринимателей. Подключение ИП к корпоративным тарифам СДЭК: тарифная сетка УСН без начисления НДС 22%, ежемесячная постоплата по счету, доступ к наложенному платежу и интеграции по API."
              },
              {
                  "id": "srv_self",
                  "cat": "5",
                  "path": "/dogovor/samozanyatye/",
                  "price": "205",
                  "desc": "Оформление договора СДЭК для самозанятых граждан (НПД). Регистрация договора доставки для плательщиков налога на профессиональный доход. Корпоративные тарифы на отправку посылок, интеграция по API, оплата банковской картой в ЛК."
              },
              {
                  "id": "srv_llc",
                  "cat": "5",
                  "path": "/dogovor/yur-lica/",
                  "price": "205",
                  "desc": "Оформление B2B-договора СДЭК для юридических лиц (ООО, АО). Корпоративное обслуживание коммерческих организаций: обмен закрывающими документами через системы ЭДО (Диадок, СБИС), выбор налоговой ставки (УСН или ОСНО с НДС)."
              }
          ]

          offers = ET.SubElement(shop, "offers")

          for item in offers_data:
              offer = ET.SubElement(offers, "offer", id=item["id"], available="true")
              ET.SubElement(offer, "url").text = f"{BASE_URL}{item['path']}"
              ET.SubElement(offer, "price").text = item["price"]
              ET.SubElement(offer, "currencyId").text = "RUB"
              ET.SubElement(offer, "categoryId").text = item["cat"]
              ET.SubElement(offer, "picture").text = f"{BASE_URL}/og-image.png"
              
              # В теге <name> указывается только исполнитель/компания
              ET.SubElement(offer, "name").text = COMPANY_NAME

              # 5 обязательных параметров исполнителя
              ET.SubElement(offer, "param", name="Рейтинг").text = RATING_VALUE
              ET.SubElement(offer, "param", name="Число отзывов").text = REVIEWS_COUNT
              ET.SubElement(offer, "param", name="Годы опыта").text = YEARS_EXP
              ET.SubElement(offer, "param", name="Регион").text = "Россия"
              ET.SubElement(offer, "param", name="Конверсия").text = "0.98"

              # В теге <description> указывается название услуги и ее описание
              ET.SubElement(offer, "description").text = item["desc"]

          rough_string = ET.tostring(yml_catalog, encoding="utf-8")
          reparsed = minidom.parseString(rough_string)
          pretty_xml = reparsed.toprettyxml(indent="  ", encoding="utf-8").decode("utf-8")

          clean_xml_lines = [line for line in pretty_xml.splitlines() if line.strip()]
          final_xml = "\n".join(clean_xml_lines)

          with open("services.yml", "w", encoding="utf-8") as f:
              f.write(final_xml)

      - name: Commit and push services.yml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add services.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(feed): strictly isolate executor name in name tag, put service title in description [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

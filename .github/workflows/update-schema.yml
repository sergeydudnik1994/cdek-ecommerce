name: Update Schema.org Rich Snippets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inject Schema.org with Action Buttons
        shell: python
        run: |
          import os
          import re
          import json

          BASE_DIR = "."
          BASE_URL = "https://cdek-ecommerce.ru"
          PHONE = "+7-993-322-15-20"
          EMAIL = "sv.dudik@cdek.ru"
          TELEGRAM = "https://t.me/cdek_marketplace"
          WHATSAPP = "https://wa.me/79933221520"
          MAX_APP = "https://max.ru/u/f9LHodD0cOIzaS1qORDXcJzrkKFof3ACzehNo6cFxOcrfwa6KtVgohy-Pxo"

          count = 0

          for root, dirs, files in os.walk(BASE_DIR):
              if any(skip in root for skip in [".git", ".github", "components", "scripts"]):
                  continue
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      # Извлекаем title и description
                      title_m = re.search(r"<title>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
                      title = title_m.group(1).strip() if title_m else "СДЭК E-Commerce"

                      desc_m = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', content, re.IGNORECASE)
                      desc = desc_m.group(1).strip() if desc_m else title

                      # Формируем URL страницы
                      rel_path = os.path.relpath(filepath, BASE_DIR).replace("\\", "/")
                      if rel_path == "index.html":
                          page_url = f"{BASE_URL}/"
                          page_name = "Главная"
                      else:
                          clean_path = rel_path.replace("index.html", "").strip("/")
                          page_url = f"{BASE_URL}/{clean_path}/" if clean_path else f"{BASE_URL}/"
                          page_name = title.split("|")[0].split("—")[0].split(":")[0].strip()

                      # Формируем хлебные крошки
                      breadcrumbs = [
                          {"@type": "ListItem", "position": 1, "name": "Главная", "item": f"{BASE_URL}/"}
                      ]
                      if "dogovor/" in page_url and page_url != f"{BASE_URL}/dogovor/":
                          breadcrumbs.append({"@type": "ListItem", "position": 2, "name": "Договор", "item": f"{BASE_URL}/dogovor/"})
                          breadcrumbs.append({"@type": "ListItem", "position": 3, "name": page_name, "item": page_url})
                      elif page_url != f"{BASE_URL}/":
                          breadcrumbs.append({"@type": "ListItem", "position": 2, "name": page_name, "item": page_url})

                      # Сборка графа Schema.org
                      schema_graph = {
                          "@context": "https://schema.org",
                          "@graph": [
                              {
                                  "@type": "WebSite",
                                  "@id": f"{BASE_URL}/#website",
                                  "url": f"{BASE_URL}/",
                                  "name": "СДЭК E-Commerce",
                                  "inLanguage": "ru-RU"
                              },
                              {
                                  "@type": "Organization",
                                  "@id": f"{BASE_URL}/#organization",
                                  "name": "СДЭК E-Commerce",
                                  "url": f"{BASE_URL}/",
                                  "logo": f"{BASE_URL}/favicon.png",
                                  "email": EMAIL,
                                  "telephone": PHONE,
                                  "sameAs": [TELEGRAM, WHATSAPP, MAX_APP],
                                  "contactPoint": [
                                      {
                                          "@type": "ContactPoint",
                                          "telephone": PHONE,
                                          "contactType": "sales",
                                          "areaServed": "RU",
                                          "availableLanguage": ["Russian"],
                                          "contactOption": "TollFree"
                                      },
                                      {
                                          "@type": "ContactPoint",
                                          "url": TELEGRAM,
                                          "contactType": "customer support",
                                          "availableLanguage": ["Russian"]
                                      },
                                      {
                                          "@type": "ContactPoint",
                                          "url": MAX_APP,
                                          "contactType": "customer support",
                                          "availableLanguage": ["Russian"]
                                      }
                                  ],
                                  "potentialAction": [
                                      {
                                          "@type": "CommunicateAction",
                                          "name": "Написать в Telegram",
                                          "target": TELEGRAM
                                      },
                                      {
                                          "@type": "CommunicateAction",
                                          "name": "Написать в WhatsApp",
                                          "target": WHATSAPP
                                      },
                                      {
                                          "@type": "CommunicateAction",
                                          "name": "Написать в MAX",
                                          "target": MAX_APP
                                      },
                                      {
                                          "@type": "OrderAction",
                                          "name": "Заключить договор онлайн",
                                          "target": f"{page_url}#lead-form"
                                      }
                                  ]
                              },
                              {
                                  "@type": "BreadcrumbList",
                                  "@id": f"{page_url}#breadcrumb",
                                  "itemListElement": breadcrumbs
                              },
                              {
                                  "@type": "Service",
                                  "@id": f"{page_url}#service",
                                  "name": title,
                                  "provider": {"@id": f"{BASE_URL}/#organization"},
                                  "areaServed": {"@type": "Country", "name": "Россия"},
                                  "description": desc,
                                  "offers": {
                                      "@type": "Offer",
                                      "price": "205",
                                      "priceCurrency": "RUB",
                                      "availability": "https://schema.org/InStock",
                                      "url": page_url
                                  }
                              }
                          ]
                      }

                      schema_json_str = json.dumps(schema_graph, ensure_ascii=False, indent=2)
                      new_schema_block = f'<script type="application/ld+json">\n{schema_json_str}\n</script>'

                      # Удаляем старую разметку
                      content_clean = re.sub(r'<script\s+type=["\']application/ld\+json["\']>.*?</script>', '', content, flags=re.DOTALL)

                      # Вставляем перед </head>
                      if "</head>" in content_clean:
                          updated_html = content_clean.replace("</head>", f"  {new_schema_block}\n</head>")
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(updated_html)
                          count += 1
                          print(f"Обновлена микроразметка: {filepath}")

          print(f"Всего файлов обновлено: {count}")

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "feat(seo): update Schema.org with MAX messenger and rich actions [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Изменений нет."
          fi

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint PHP syntax
        run: find . -name "*.php" -exec php -l {} +

      - name: Check critical files
        run: |
          test -f index.html || exit 1
          test -f send-lead.php || exit 1
          test -f components/lead-form.html || exit 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VDS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            git config --global --add safe.directory /var/www/cdek-ecommerce.ru
            cd /var/www/cdek-ecommerce.ru
            git fetch origin main
            git reset --hard origin/main
            chown -R www-data:www-data /var/www/cdek-ecommerce.ru
            chmod -R 755 /var/www/cdek-ecommerce.ru

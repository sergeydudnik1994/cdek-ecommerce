  <!-- Гео-скрипт мгновенной подстановки города -->
  <script>
    (async function() {
      const declensions = {
        "москва": "в Москве",
        "санкт-петербург": "в Санкт-Петербурге",
        "краснодар": "в Краснодаре",
        "екатеринбург": "в Екатеринбурге",
        "новосибирск": "в Новосибирске",
        "казань": "в Казани"
      };

      function applyCity(text) {
        document.querySelectorAll('.dynamic-city-prep').forEach(el => {
          el.textContent = text;
        });
      }

      let cached = localStorage.getItem('user_city_prep');
      if (cached) {
        applyCity(cached);
        return;
      }

      try {
        let res = await fetch('https://ipwho.is/?lang=ru');
        if (!res.ok) return;
        let data = await res.json();
        
        let rawCity = (data.city || "").trim();
        let cityName = rawCity ? rawCity.charAt(0).toUpperCase() + rawCity.slice(1) : "";
        let targetPrep = declensions[cityName.toLowerCase()] || (cityName ? `в г. ${cityName}` : "в вашем городе");

        localStorage.setItem('user_city_prep', targetPrep);
        applyCity(targetPrep);
      } catch (e) {}
    })();
  </script>

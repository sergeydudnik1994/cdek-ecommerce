<section id="calculator" class="py-14 sm:py-20 bg-slate-50 border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Заголовок -->
    <div class="text-center max-w-2xl mx-auto mb-10 sm:mb-12">
      <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-100 text-[#158E3A] mb-2.5">
        Тарифный калькулятор
      </span>
      <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
        Рассчитать стоимость доставки
      </h2>
      <p class="text-slate-500 text-xs sm:text-sm mt-2">
        Сравните тарифы для бизнеса с розничными ценами и оцените выгоду корпоративного договора
      </p>
    </div>

    <!-- Основная карточка калькулятора -->
    <div class="max-w-4xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Левая колонка: параметры -->
        <div class="lg:col-span-7 space-y-5">
          
          <!-- Города отправки и доставки -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 relative">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Откуда</label>
              <input 
                type="text" 
                id="calc-city-from" 
                value="Москва" 
                placeholder="Город отправки" 
                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-900 focus:bg-white focus:ring-2 focus:ring-[#1AB248] focus:border-[#1AB248] outline-none transition"
              />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Куда</label>
              <input 
                type="text" 
                id="calc-city-to" 
                value="Санкт-Петербург" 
                placeholder="Город получения" 
                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-900 focus:bg-white focus:ring-2 focus:ring-[#1AB248] focus:border-[#1AB248] outline-none transition"
              />
            </div>
          </div>

          <!-- Способ доставки -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Способ вручения</label>
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl text-xs font-bold">
              <button 
                type="button" 
                id="mode-pvz-btn" 
                onclick="setCalcMode('pvz')" 
                class="py-2 px-3 rounded-lg bg-white text-slate-900 shadow-xs transition cursor-pointer"
              >
                В пункт выдачи (ПВЗ)
              </button>
              <button 
                type="button" 
                id="mode-door-btn" 
                onclick="setCalcMode('door')" 
                class="py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer"
              >
                Курьером до двери
              </button>
            </div>
          </div>

          <!-- Вес отправления -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Вес посылки</label>
            <div class="flex items-center gap-2">
              <div class="grid grid-cols-4 gap-2 flex-grow">
                <button type="button" onclick="setCalcWeight(1)" id="w-btn-1" class="py-2 px-2 rounded-xl text-xs font-bold border-2 border-[#1AB248] bg-emerald-50 text-[#158E3A] transition cursor-pointer">1 кг</button>
                <button type="button" onclick="setCalcWeight(3)" id="w-btn-3" class="py-2 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition cursor-pointer">3 кг</button>
                <button type="button" onclick="setCalcWeight(5)" id="w-btn-5" class="py-2 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition cursor-pointer">5 кг</button>
                <button type="button" onclick="setCalcWeight(10)" id="w-btn-10" class="py-2 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition cursor-pointer">10 кг</button>
              </div>
              <div class="w-24 flex-shrink-0">
                <input 
                  type="number" 
                  id="calc-weight-input" 
                  value="1" 
                  min="0.1" 
                  max="100" 
                  step="0.5" 
                  oninput="onManualWeightChange()" 
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-center text-slate-900 focus:bg-white focus:ring-2 focus:ring-[#1AB248] outline-none" 
                />
              </div>
            </div>
          </div>

          <button 
            type="button" 
            onclick="calculateDelivery()" 
            class="w-full py-3.5 px-6 bg-[#1AB248] hover:bg-[#158E3A] text-white font-extrabold text-xs uppercase tracking-wider rounded-xl transition shadow-md shadow-[#1AB248]/20 cursor-pointer active:scale-95"
          >
            Рассчитать доставку
          </button>

        </div>

        <!-- Правая колонка: результаты расчета -->
        <div class="lg:col-span-5 bg-slate-50 border border-slate-200/80 rounded-2xl p-6 flex flex-col justify-between">
          <div class="space-y-4">
            
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <span class="text-xs font-semibold text-slate-500">Направление</span>
              <span class="text-xs font-bold text-slate-900" id="res-route">Москва → Санкт-Петербург</span>
            </div>

            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <span class="text-xs font-semibold text-slate-500">Срок доставки</span>
              <span class="text-xs font-bold text-slate-900" id="res-days">1–2 раб. дня</span>
            </div>

            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <span class="text-xs font-semibold text-slate-500">Без договора (розница)</span>
              <span class="text-xs font-medium text-slate-400 line-through" id="res-retail">410 ₽</span>
            </div>

            <div class="pt-1">
              <span class="text-xs font-bold text-slate-700 block">По B2B-договору:</span>
              <div class="flex items-baseline gap-2 mt-1">
                <span class="text-3xl font-black text-[#1AB248]" id="res-price">263 ₽</span>
                <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full" id="res-discount">−36%</span>
              </div>
            </div>

          </div>

          <a 
            href="/#lead-form" 
            class="mt-6 block w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold text-center text-xs uppercase tracking-wider rounded-xl transition cursor-pointer"
          >
            Заключить договор
          </a>
        </div>

      </div>
    </div>

  </div>
</section>

<script>
  let currentCalcMode = 'pvz';
  let currentCalcWeight = 1;

  function setCalcMode(mode) {
    currentCalcMode = mode;
    const pvzBtn = document.getElementById('mode-pvz-btn');
    const doorBtn = document.getElementById('mode-door-btn');
    if (mode === 'pvz') {
      pvzBtn.className = "py-2 px-3 rounded-lg bg-white text-slate-900 shadow-xs transition cursor-pointer";
      doorBtn.className = "py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer";
    } else {
      doorBtn.className = "py-2 px-3 rounded-lg bg-white text-slate-900 shadow-xs transition cursor-pointer";
      pvzBtn.className = "py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer";
    }
    calculateDelivery();
  }

  function setCalcWeight(w) {
    currentCalcWeight = w;
    document.getElementById('calc-weight-input').value = w;
    [1, 3, 5, 10].forEach(val => {
      const btn = document.getElementById('w-btn-' + val);
      if (btn) {
        if (val === w) {
          btn.className = "py-2 px-2 rounded-xl text-xs font-bold border-2 border-[#1AB248] bg-emerald-50 text-[#158E3A] transition cursor-pointer";
        } else {
          btn.className = "py-2 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition cursor-pointer";
        }
      }
    });
    calculateDelivery();
  }

  function onManualWeightChange() {
    const val = parseFloat(document.getElementById('calc-weight-input').value) || 1;
    currentCalcWeight = val;
    [1, 3, 5, 10].forEach(w => {
      const btn = document.getElementById('w-btn-' + w);
      if (btn) {
        btn.className = (w === val) 
          ? "py-2 px-2 rounded-xl text-xs font-bold border-2 border-[#1AB248] bg-emerald-50 text-[#158E3A] transition cursor-pointer"
          : "py-2 px-2 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition cursor-pointer";
      }
    });
    calculateDelivery();
  }

  async function calculateDelivery() {
    const from = document.getElementById('calc-city-from').value.trim() || 'Москва';
    const to = document.getElementById('calc-city-to').value.trim() || 'Санкт-Петербург';
    const weight = currentCalcWeight;

    document.getElementById('res-route').innerText = `${from} → ${to}`;

    try {
      const response = await fetch('/cdek-service.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cityFrom: from,
          cityTo: to,
          weight: weight,
          mode: currentCalcMode
        })
      });

      const data = await response.json();
      if (data.success && data.result) {
        const res = data.result;
        document.getElementById('res-price').innerText = `${res.price} ₽`;
        document.getElementById('res-retail').innerText = `${res.retailPrice} ₽`;
        document.getElementById('res-days').innerText = `${res.deliveryPeriodMin}–${res.deliveryPeriodMax} раб. дня`;
        
        const discount = Math.round((1 - (res.price / res.retailPrice)) * 100);
        document.getElementById('res-discount').innerText = `−${discount}%`;
      }
    } catch (e) {
      console.log('Использован локальный расчет');
    }
  }

  document.addEventListener('DOMContentLoaded', calculateDelivery);
</script>
